name: Release Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version segment to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: onefolder
          POSTGRES_USER: onefolder
          POSTGRES_PASSWORD: onefolder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onefolder"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Postgres integration test
        run: npx vitest run src/server/persistence/postgres/integration.test.ts
        env:
          TEST_DATABASE_URL: "postgresql://onefolder:onefolder@localhost:5432/onefolder?sslmode=disable"

  release:
    needs: [validate, postgres-integration]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'chore(release):')))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Increment semantic version
        id: version
        shell: bash
        run: |
          CURRENT="$(node -p "require('./package.json').version")"
          LATEST_TAG="$(git tag -l 'v*' --sort -v:creationdate | head -1 || echo '')"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"

          # If latest tag version differs from current package version, publish current version
          if [ -n "$LATEST_TAG" ]; then
            LATEST_TAG_VERSION="${LATEST_TAG#v}"
            if [ "$LATEST_TAG_VERSION" != "$CURRENT" ]; then
              # Publish current 0.4.0 without bumping or empty commit
              VERSION="$CURRENT"
              echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
              echo "skip_bump=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Otherwise apply requested/default bump
          BUMP="${{ inputs.bump || 'patch' }}"
          npm version "$BUMP" --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          # Detect if package files changed from current to new version
          if [ "$CURRENT" != "$VERSION" ]; then
            git add package.json package-lock.json
            git commit -m "chore(release): v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git tag "v${VERSION}"

      - name: Push release commit and tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SKIP_BUMP="${{ steps.version.outputs.skip_bump }}"
          if [ "${SKIP_BUMP}" = "true" ]; then
            git push origin "v${VERSION}"
          else
            git push origin HEAD:main
            git push origin "v${VERSION}"
          fi

      - name: Set image name
        id: image
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=match,pattern=^(\d+\.\d+)\.\d+$,group=1,value=${{ steps.version.outputs.version }}
            type=sha

      - name: Build and publish versioned Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  docker-pr:
    needs: [validate, postgres-integration]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set image name
        id: image
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=sha

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
